<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Pipeline & Applications - NexaHire Enterprise</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .view-toggle {
      display: inline-flex;
      background: var(--slate-100);
      padding: 0.2rem;
      border-radius: var(--radius-sm);
    }
    .view-toggle-btn {
      padding: 0.4rem 0.8rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--slate-600);
    }
    .view-toggle-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">N</div>
        <div class="brand-text">Nexa<span>Hire</span></div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-mini">
          <div class="avatar" id="user-initials">U</div>
          <div style="flex:1;overflow:hidden;">
            <div class="text-sm text-bold" id="user-full-name">User Name</div>
            <span class="badge badge-primary text-xs" id="user-role-badge">ROLE</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="flex items-center gap-3">
          <h3 id="page-header-title">ATS Recruitment Pipeline</h3>
        </div>
        <div class="flex items-center gap-4">
          <div class="view-toggle" id="staff-view-toggle" style="display:none;">
            <button class="view-toggle-btn active" id="btn-kanban" onclick="switchView('kanban')">Kanban Pipeline</button>
            <button class="view-toggle-btn" id="btn-table" onclick="switchView('table')">Table View</button>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="handleLogout()">Sign Out</button>
        </div>
      </header>

      <div class="page-body">
        <!-- Staff Job Filter Selector -->
        <div class="card mb-6" id="ats-filter-bar" style="display:none;padding:1rem;">
          <div class="grid grid-3 gap-3 items-center">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label text-xs">Filter by Job Opening:</label>
              <select id="pipeline-job-select" class="form-control" onchange="loadPipelineData()">
                <option value="">All Active Openings</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label text-xs">Search Candidate / Email:</label>
              <input type="text" id="candidate-search" class="form-control" placeholder="Search applicants..." oninput="debounceSearch()">
            </div>
            <div class="flex items-center gap-2" style="margin-top:1.4rem;">
              <button class="btn btn-secondary btn-sm" onclick="loadPipelineData()">Refresh Pipeline</button>
            </div>
          </div>
        </div>

        <!-- Kanban Board View -->
        <div id="kanban-view" class="pipeline-container">
          <!-- Rendered dynamically -->
        </div>

        <!-- Table View -->
        <div id="table-view" style="display:none;">
          <div class="card">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Candidate</th>
                    <th>Position</th>
                    <th>Keyword Match</th>
                    <th>Current Stage</th>
                    <th>Applied At</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="table-body">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Review / Advance Modal -->
  <div id="status-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h4 id="status-modal-title">Update Candidate Pipeline Stage</h4>
        <button class="btn-icon btn-secondary" onclick="closeModal('status-modal')">&times;</button>
      </div>
      <form id="status-form">
        <input type="hidden" id="status-app-id">
        <div class="modal-body">
          <div id="status-candidate-details" class="card mb-4" style="background:var(--slate-50);padding:1rem;"></div>

          <div class="form-group">
            <label class="form-label" for="new-stage-select">Move Candidate to Stage:</label>
            <select id="new-stage-select" class="form-control">
              <option value="APPLIED">Applied</option>
              <option value="SCREENING">Screening</option>
              <option value="SHORTLISTED">Shortlisted</option>
              <option value="INTERVIEW">Interview</option>
              <option value="SELECTED">Selected / Hired</option>
              <option value="REJECTED">Rejected</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="stage-notes">Recruiter Notes / Evaluation</label>
            <textarea id="stage-notes" class="form-control" rows="3" placeholder="Enter feedback, test scores, or rationale for this stage transition..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('status-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Confirm Transition</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Application Details & Resume Modal -->
  <div id="app-detail-modal" class="modal-backdrop">
    <div class="modal" style="max-width:750px;">
      <div class="modal-header">
        <h4>Candidate Application Dossier</h4>
        <button class="btn-icon btn-secondary" onclick="closeModal('app-detail-modal')">&times;</button>
      </div>
      <div class="modal-body" id="app-detail-body">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('app-detail-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/applications.js"></script>
</body>
</html>
